<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - تزكيات</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-title">
        <h1 class="logo-arabic">تزكيات</h1>
        <p>Reset your password</p>
      </div>

      <!-- Step 1: Enter username -->
      <form id="step1-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Continue</button>
      </form>

      <!-- Step 2: Answer security question and set new password (hidden initially) -->
      <form id="step2-form" class="hidden">
        <div class="form-group">
          <label>Security Question</label>
          <p id="security-question" class="form-control" style="background: var(--bg-tertiary); cursor: default;"></p>
        </div>

        <div class="form-group">
          <label for="security-answer">Your Answer</label>
          <input type="text" id="security-answer" class="form-control" placeholder="Enter your answer" required>
        </div>

        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-control" placeholder="Enter new password (min 6 chars)" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Confirm new password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
        <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="goBack()">Back</button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfAuth();

    let currentUsername = '';

    // Step 1: Get security question
    document.getElementById('step1-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const username = document.getElementById('username').value.trim();

      if (!username) {
        showAlert(form, 'Please enter your username');
        return;
      }

      try {
        const response = await fetch(`/api/auth/forgot-password/${encodeURIComponent(username)}`);
        const data = await response.json();

        if (!response.ok) {
          showAlert(form, data.error || 'Unable to process request');
          return;
        }

        // Store username and show step 2
        currentUsername = username;
        document.getElementById('security-question').textContent = data.question;
        document.getElementById('step1-form').classList.add('hidden');
        document.getElementById('step2-form').classList.remove('hidden');
        document.getElementById('security-answer').focus();

      } catch (error) {
        showAlert(form, 'Network error. Please try again.');
      }
    });

    // Step 2: Reset password
    document.getElementById('step2-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const securityAnswer = document.getElementById('security-answer').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        showAlert(form, 'Passwords do not match');
        return;
      }

      if (newPassword.length < 6) {
        showAlert(form, 'Password must be at least 6 characters');
        return;
      }

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: currentUsername,
            securityAnswer: securityAnswer,
            newPassword: newPassword
          })
        });

        const data = await response.json();

        if (!response.ok) {
          showAlert(form, data.error || 'Unable to reset password');
          return;
        }

        // Success - show message and redirect
        showAlert(form, data.message, 'success');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 2000);

      } catch (error) {
        showAlert(form, 'Network error. Please try again.');
      }
    });

    function goBack() {
      document.getElementById('step2-form').classList.add('hidden');
      document.getElementById('step1-form').classList.remove('hidden');
      document.getElementById('security-answer').value = '';
      document.getElementById('new-password').value = '';
      document.getElementById('confirm-password').value = '';
      currentUsername = '';
    }
  </script>
</body>
</html>
